<style>
  body { background: #121212; color: #ffffff; font-family: Arial, sans-serif; text-align: center; padding: 20px; margin: 0; }
  .top-bar { position: sticky; top: 0; background: #121212; padding: 14px; z-index: 100; border-bottom: 1px solid #333; display: flex; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap; }

  .select-mode { background: #262626; color: #fff; border: 1px solid #555; padding: 10px 14px; font-size: 14px; border-radius: 6px; cursor: pointer; }
  .card-box { background: #1e1e1e; margin: 25px auto; padding: 15px; border-radius: 8px; max-width: 1200px; box-shadow: 0 6px 22px rgba(0,0,0,0.7); }
  canvas { width: 100%; height: auto; border: 1px solid #333; display: block; }

<script>
function formatText(txt) {
  const mode = document.getElementById('accentMode').value;
  if (mode === 'all') return txt;
  if (mode === 'partial') {
    const keep = ['País', 'Línea_Aérea', 'Señal'];
    if (keep.includes(txt)) return txt;
  }
  return txt.normalize('NFD').replace(/[\u0300-\u0302\u0304-\u036f]/g, '').normalize('NFC');
}

function drawDiagram(id, title, build) {
  const cv = document.getElementById(id), ctx = cv.getContext('2d');
  const lines = [], shapes = [], cards = [], roles = [];

  const L = (x1, y1, x2, y2, opts={}) => lines.push({pts:[[x1,y1],[x2,y2]], ...opts});
  const P = (pts, opts={}) => lines.push({pts, ...opts});
  const C = (x, y, txt, opts={}) => cards.push({x, y, txt, ...opts});
  const Role = (x, y, txt) => roles.push({x, y, txt});
  const E = (x, y, txt, opts={}) => shapes.push({type:'E', x, y, txt: formatText(txt), w:195, h:70, ...opts});
  const R = (x, y, txt, opts={}) => shapes.push({type:'R', x, y, txt: formatText(txt), rx:92, ry:44, ...opts});
  const A = (x, y, txt, tx, ty, opts={}) => {
    lines.push({pts:[[x,y],[tx,ty]], dash: !!opts.lineDash});
    shapes.push({type:'A', x, y, txt: formatText(txt), rx:100, ry:22, ...opts});
  };
  const N = (x, y, w, h, linesTxt) => {
    shapes.push({type:'N', x, y, w, h, linesTxt});
  };

  build({L, P, C, Role, E, R, A, N});

  // 1. Fondo y Título Unificado
  ctx.fillStyle = '#1e1e1e';
  ctx.fillRect(0, 0, 1920, 1080);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 36px Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(title, 960, 50);

  // 2. Líneas y Conectores (simples, discontinuos o dobles para participación total)
  const strokePath = (pts) => {
    ctx.beginPath();
    pts.forEach((p, i) => i === 0 ? ctx.moveTo(p[0], p[1]) : ctx.lineTo(p[0], p[1]));
    ctx.stroke();
  };

  lines.forEach(l => {
    ctx.save();
    ctx.lineJoin = 'miter';
    ctx.lineCap = 'butt';
    if (l.dash) ctx.setLineDash([8, 6]);
    if (l.dbl) {
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 8.5;
      strokePath(l.pts);
      ctx.strokeStyle = '#1e1e1e';
      ctx.lineWidth = 3.5;
      strokePath(l.pts);
    } else {
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2.3;
      strokePath(l.pts);
    }
    ctx.restore();
  });

  // 3. Figuras (Entidades, Relaciones, Atributos y Notas)
  shapes.forEach(s => {
    ctx.save();
    ctx.fillStyle = '#1e1e1e';
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2.4;

    if (s.type === 'E') {
      ctx.fillRect(s.x - s.w/2, s.y - s.h/2, s.w, s.h);
      ctx.strokeRect(s.x - s.w/2, s.y - s.h/2, s.w, s.h);
      if (s.dbl) ctx.strokeRect(s.x - s.w/2 + 6, s.y - s.h/2 + 6, s.w - 12, s.h - 12);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 19px Arial, sans-serif';
      ctx.fillText(s.txt, s.x, s.y);
    } else if (s.type === 'R') {
      if (s.dash) ctx.setLineDash([8, 6]);
      const drawDiamond = (rx, ry) => {
        ctx.beginPath();
        ctx.moveTo(s.x, s.y - ry);
        ctx.lineTo(s.x + rx, s.y);
        ctx.lineTo(s.x, s.y + ry);
        ctx.lineTo(s.x - rx, s.y);
        ctx.closePath();
      };
      drawDiamond(s.rx, s.ry);
      ctx.fill(); ctx.stroke();
      if (s.dbl) {
        drawDiamond(s.rx - 8, s.ry - 5);
        ctx.stroke();
      }
      ctx.setLineDash([]);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 15px Arial, sans-serif';
      ctx.fillText(s.txt, s.x, s.y);

      if (s.relType) {
        ctx.font = 'bold 15px Arial, sans-serif';
        const pos = s.relPos || 'top';
        let tx = s.x, ty = s.y - s.ry - 14;
        if (pos === 'bottom') { tx = s.x; ty = s.y + s.ry + 16; }
        else if (pos === 'left') { tx = s.x - s.rx - 26; ty = s.y; }
        else if (pos === 'right') { tx = s.x + s.rx + 26; ty = s.y; }
        const tw = ctx.measureText(s.relType).width + 6;
        ctx.fillStyle = '#1e1e1e';
        ctx.fillRect(tx - tw/2, ty - 10, tw, 20);
        ctx.fillStyle = '#00e676';
        ctx.fillText(s.relType, tx, ty);
      }
    } else if (s.type === 'A') {
      if (s.drv) ctx.setLineDash([7, 5]);
      ctx.beginPath();
      ctx.ellipse(s.x, s.y, s.rx, s.ry, 0, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
      if (s.multi) {
        ctx.beginPath();
        ctx.ellipse(s.x, s.y, s.rx - 5, s.ry - 4, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.setLineDash([]);
      ctx.fillStyle = '#ffffff';
      ctx.font = ((s.pk || s.ppk) ? 'bold ' : '') + '15.5px Arial, sans-serif';
      ctx.fillText(s.txt, s.x, s.y);
      if (s.pk || s.ppk) {
        const w = ctx.measureText(s.txt).width;
        ctx.beginPath();
        ctx.lineWidth = 1.8;
        if (s.ppk) ctx.setLineDash([5, 4]);
        ctx.moveTo(s.x - w/2, s.y + 10);
        ctx.lineTo(s.x + w/2, s.y + 10);
        ctx.stroke();
      }
    } else if (s.type === 'N') {
      ctx.setLineDash([7, 6]);
      ctx.fillRect(s.x - s.w/2, s.y - s.h/2, s.w, s.h);
      ctx.strokeRect(s.x - s.w/2, s.y - s.h/2, s.w, s.h);
      ctx.setLineDash([]);
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'left';
      s.linesTxt.forEach((t, i) => {
        ctx.font = (i === 0 ? 'bold ' : '') + '14px Arial, sans-serif';
        ctx.fillText(t, s.x - s.w/2 + 15, s.y - s.h/2 + 23 + i * 20);
      });
    }
    ctx.restore();
  });

  // 4. Roles en Blanco Cursiva
  ctx.fillStyle = '#e0e0e0';
  ctx.font = 'italic 15px Arial, sans-serif';
  roles.forEach(r => ctx.fillText(r.txt, r.x, r.y));

  // 5. Cardinalidades (mín,máx) en Verde con fondo limpio
  cards.forEach(c => {
    ctx.save();
    ctx.font = 'bold 17px Arial, sans-serif';
    const w = ctx.measureText(c.txt).width + 6;
    ctx.fillStyle = '#1e1e1e';
    ctx.fillRect(c.x - w/2, c.y - 10, w, 20);
    ctx.fillStyle = '#00e676';
    ctx.fillText(c.txt, c.x, c.y);
    ctx.restore();
  });
}

function dl(id, name) {
  const a = document.createElement('a');
  a.download = name;
  a.href = document.getElementById(id).toDataURL('image/png');
  a.click();
}
function downloadAll() {
  ['c1','c2','c3','c4'].forEach((id, i) => setTimeout(() => dl(id, `Ejercicio_${i+1}_Corregido.png`), i * 350));
}
